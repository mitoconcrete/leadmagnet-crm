<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>리드마그넷 신청 폼</title>
</head>
<body>
  <h1>무료 체험 신청</h1>
  <p>아래 정보를 입력하고 신청해 주세요. 문의: contact@example.com</p>
  <form>
    <label>이름 <input name="name" required /></label>
    <label>이메일 <input name="email" type="email" /></label>
    <label>관심 분야
      <select name="interest" multiple>
        <option value="marketing">마케팅</option>
        <option value="sales">세일즈</option>
        <option value="design">디자인</option>
      </select>
    </label>
    <button type="submit">신청</button>
  </form>
</body>
</html>
