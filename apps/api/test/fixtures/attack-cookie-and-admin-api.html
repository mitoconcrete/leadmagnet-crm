<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>공격: 쿠키·관리자 API 접근</title>
</head>
<body>
  <h1>무료 체험 신청</h1>
  <form>
    <label>이름 <input name="name" required /></label>
    <button type="submit">신청</button>
  </form>
  <pre id="attack-result">대기 중</pre>
  <script>
    (function () {
      var out = {};

      // sandbox 문서(opaque origin, 동일 출처 허용 없음)에서는 document.cookie 접근 자체가
      // SecurityError로 예외를 던진다(Chromium 기준. 다른 브라우저 엔진에서 빈 문자열을
      // 반환할 가능성까지는 이 픽스처 하나로 보증하지 않는다 — 브라우저 e2e는 실행 엔진의
      // 실제 동작을 그대로 단언한다).
      try {
        out.cookie = { threw: false, value: document.cookie };
      } catch (err) {
        out.cookie = { threw: true, error: err.name, message: err.message };
      }

      function describe(res) {
        return { status: res.status };
      }

      function describeError(err) {
        return { error: err && err.name, message: err && err.message };
      }

      var readAttempts = [
        { key: 'relativeAdminCampaigns', url: '/api/admin/campaigns' },
        { key: 'absolute3001AdminCampaigns', url: 'http://localhost:3001/api/admin/campaigns' },
        { key: 'absolute3000AdminMe', url: 'http://localhost:3000/api/admin/auth/me' },
      ];

      // 상태 변경 시도: 응답을 못 읽어도(CORS) 요청 자체가 서버에 부작용을 남기는지가
      // 진짜 관찰 대상이다. 세 오리진 모두에서 캠페인 생성을 시도한다.
      var mutateAttempts = [
        { key: 'relativeAdminCampaignsPost', url: '/api/admin/campaigns' },
        { key: 'absolute3001AdminCampaignsPost', url: 'http://localhost:3001/api/admin/campaigns' },
        { key: 'absolute3000AdminCampaignsPost', url: 'http://localhost:3000/api/admin/campaigns' },
      ];

      var reads = readAttempts.map(function (a) {
        return fetch(a.url, { credentials: 'include' })
          .then(function (res) {
            out[a.key] = describe(res);
          })
          .catch(function (err) {
            out[a.key] = describeError(err);
          });
      });

      var mutations = mutateAttempts.map(function (a) {
        return fetch(a.url, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'ATTACK-H3-MARKER' }),
        })
          .then(function (res) {
            out[a.key] = describe(res);
          })
          .catch(function (err) {
            out[a.key] = describeError(err);
          });
      });

      Promise.all(reads.concat(mutations)).then(function () {
        document.getElementById('attack-result').textContent = JSON.stringify(out);
      });
    })();
  </script>
</body>
</html>
