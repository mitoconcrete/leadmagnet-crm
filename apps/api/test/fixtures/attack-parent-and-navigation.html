<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>공격: 부모 접근·내비게이션·저장소</title>
</head>
<body>
  <h1>무료 체험 신청</h1>
  <form>
    <label>이름 <input name="name" required /></label>
    <button type="submit">신청</button>
  </form>
  <a id="top-nav-link" href="https://evil.example/">최상위로 이동</a>
  <pre id="attack-result">대기 중</pre>
  <script>
    (function () {
      // 등록 차단 규칙(ADR 0018 2026-09-10 개정)은 부모/최상위 창 접근, 브라우저 저장소,
      // target=_top/_parent를 정적으로 찾아 등록 자체를 거부한다. 격리(sandbox iframe, CSP)가
      // 실제로 막는지 증명하는 것이 목적이므로, 같은 시도를 실행 시점에 문자열을 쪼개 조립하거나
      // 속성을 런타임에 설정해 등록은 통과시키고 브라우저 실행 결과로 판정한다
      // (samples/isolation-check.html과 같은 방식) — 브라우저가 실제로 실행할 때는
      // 원래 시도와 완전히 같다.
      document.getElementById('top-nav-link').target = '_top';

      var out = {};

      try {
        out.parentTitle = { ok: true, value: window['par' + 'ent'].document.title };
      } catch (err) {
        out.parentTitle = { error: err.name, message: err.message };
      }

      try {
        window['t' + 'op'].location.href = 'https://evil.example/';
        out.topNavigation = { attempted: true, threw: false };
      } catch (err) {
        out.topNavigation = { attempted: true, threw: true, error: err.name, message: err.message };
      }

      try {
        var w = window.open('https://evil.example/', '_blank');
        out.windowOpen = { attempted: true, threw: false, result: w === null ? 'null' : 'window' };
      } catch (err) {
        out.windowOpen = { attempted: true, threw: true, error: err.name, message: err.message };
      }

      try {
        window['local' + 'Storage'].setItem('attack', 'value');
        out.storage = { ok: true, threw: false };
      } catch (err) {
        out.storage = { threw: true, error: err.name, message: err.message };
      }

      document.getElementById('attack-result').textContent = JSON.stringify(out);
    })();
  </script>
</body>
</html>
